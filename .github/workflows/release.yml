name: CI/CD Pipeline

on:
  # 1. 监听所有分支的 Push (包括 feature/*, fix/*)
  # 目的：你在任何分支提交代码，CI 都会帮你跑测试
  push:
    branches:
      - '**' # 监听所有分支
    tags:
      - 'v*' # 监听打版标签 (用来触发发布)

  # 2. 监听 PR (双重保险)
  pull_request:
    branches:
      - 'main'

permissions:
  contents: write
  id-token: write

jobs:
  # Job 1: 质量检查 (测试)
  # 无论你在哪个分支，只要提交代码就跑测试，给你兜底
  check:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # Job 2: 构建与发布
  publish:
    name: Build & Publish
    needs: check
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    # 1. 修正权限
    permissions:
      contents: write # 允许创建 Release
      id-token: write # 允许 npm provenance 证明

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" == *"alpha"* ]]; then
            npm publish --provenance --tag alpha --access public
          elif [[ "$TAG_NAME" == *"beta"* ]]; then
            npm publish --provenance --tag beta --access public
          elif [[ "$TAG_NAME" == *"rc"* ]]; then
            npm publish --provenance --tag rc --access public
          else
            npm publish --provenance --access public
          fi
        shell: bash

      # 2. 升级 Action 版本并保留参数
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
