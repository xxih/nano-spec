name: CI/CD Pipeline

on:
  # 1. 监听所有分支的 Push (包括 feature/*, fix/*)
  # 目的：你在任何分支提交代码，CI 都会帮你跑测试
  push:
    branches:
      - '**' # 监听所有分支
    tags:
      - 'v*' # 监听打版标签 (用来触发发布)

  # 2. 监听 PR (双重保险)
  pull_request:
    branches:
      - 'main'

permissions:
  contents: write
  id-token: write

jobs:
  # Job 1: 质量检查 (测试)
  # 无论你在哪个分支，只要提交代码就跑测试，给你兜底
  check:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # Job 2: 构建与发布
  publish:
    name: Build & Publish
    needs: check
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    # 🔥🔥🔥 关键点 1：确保 id-token 写权限存在（你原本代码里有，这里再次确认）
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 🔥🔥🔥 关键点 2：删掉 registry-url 这一行
          # registry-url: 'https://registry.npmjs.org'  <-- 删掉它！不要让它生成依赖 Token 的配置文件

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        # 🔥🔥🔥 关键点 3：加上 --provenance 参数，且不需要 env 环境变量
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" == *"alpha"* ]]; then
            echo "Publishing to alpha channel..."
            npm publish --provenance --tag alpha --access public
          elif [[ "$TAG_NAME" == *"beta"* ]]; then
            echo "Publishing to beta channel..."
            npm publish --provenance --tag beta --access public
          elif [[ "$TAG_NAME" == *"rc"* ]]; then
            echo "Publishing to rc channel..."
            npm publish --provenance --tag rc --access public
          else
            echo "Publishing to latest channel..."
            npm publish --provenance --access public
          fi
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
