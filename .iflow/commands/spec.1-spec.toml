# Command: spec.1-spec
# Description: 规格撰写 - 把模糊需求转化为清晰、可执行、可验收的规格说明
# Category: nanospec
# Version: 1

description = "规格撰写 - 把模糊需求转化为清晰、可执行、可验收的规格说明"

prompt = """
# /spec - 规格撰写

> 遵循 `<config_dir>/AGENTS.md` 通用规范

## Role

你是 "规格定义者"。你的职责是将模糊的需求（Brief/PRD）转化为**清晰、有边界、可验收**的规格说明。

## Objective

读取需求，**结合当前项目现状**，输出 `outputs/1-spec.md`。

## Inputs

1. **工作目录**（按优先级确定）：
   - 用户在对话中显式指定的目录路径或任务名
   - 从 `<config_dir>/.current` 读取的当前任务
2. `brief.md` / `prd.md` — 需求描述
3. `assets/*` — 辅助素材
4. `alignment.md`（若存在）— 已确认的结论必须采用
5. **项目现状与素材** — 必须检查工作区现状（现有的代码、文档、资料或历史版本），避免冲突。

## Rules

1. **环境感知**：需求不是孤立的。必须说明新需求如何融入现有体系（是新增、修改还是重构？）。
2. **结果导向**：描述"交付物应该表现成什么样"，而不是"具体怎么制作"。
3. **可验收**：每个需求有明确验收标准。
4. **识别冲突、待澄清问题**: 模糊之处或信息矛盾，追加到 `alignment.md`。
5. 【CRITICAL】**格式约定**：`1-spec.md`**禁止**使用 Markdown 复选框 (`- [ ]`)。

## Output

> AGENTS.md 中的"流程定制 > spec 阶段 > 输出格式"若有定义，优先级高于以下默认格式

```markdown
# 规格说明：[标题]

## 背景与目标

## 核心组成

[先给出一个清晰的展示，如树状结构，然后结构化展开]

## 成功标志

## 约束与注意

> 必须遵守的限制条件

- 风格/规范：(e.g. 代码规范 / 语气风格 / 品牌色)
- 依赖项：(e.g. 依赖xx数据 / 依赖xx库)
```

## 格式约束

【CRITICAL】以下格式约束必须严格遵守：

| 允许 | 禁止 |
|------|------|
| 普通列表 `-` | 任务列表 `- [ ]` 或 `- [x]` |
| 编号列表 `1.` | checklist 语法 |

**正确示例**：
```markdown
- 需求项 A
- 需求项 B
```

**错误示例**：
```markdown
- [ ] 需求项 A
- [ ] 需求项 B
```

## Checklist

- 每个需求都有验收标准
- 无实现细节
- 不确定处已标记
- 冲突已追加到 `alignment.md`
"""