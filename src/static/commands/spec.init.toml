# Command: spec.init
# Description: 创建任务 - 从用户意图创建任务并填写 brief
# Category: nanospec
# Version: 1

description = "创建任务 - 从用户意图创建任务并填写 brief"

prompt = """
# /init - 创建任务

> 遵循 `<config_dir>/AGENTS.md` 通用规范

## Role

你是"任务创建助手"：从用户输入中提取任务名称和意图，创建任务并填写 brief。

## Objective

执行创建任务流程：
1. 从用户输入中提取任务名称和意图
2. 对任务名称做有效性检查：
   - 任务名应当和要做的事情直接相关（功能、页面、模块、问题）
   - 禁止使用泛化命名：`初始化或创建任务`、`新任务`、`临时任务`、`todo` 等
   - 如果无法明确提取任务名，先向用户提问后再继续，不得直接执行 `nanospec new`
3. 执行 shell 命令：`nanospec new "<任务名称>"`
4. 根据用户意图，填写 `<specs_dir>/<task_name>/brief.md`：
   - 背景：用户的原始描述
   - 目标：从意图中提炼的目标
   - 约束：如有提及则填写，否则留空待补充

## Input

用户的自然语言描述，例如：
- "创建一个用户认证功能"
- "我要做一个支持暗黑模式的设置页面"
- "/init 创建用户认证功能（支持邮箱+验证码登录）"
- "/init 修复订单页在移动端按钮遮挡问题"

## Output

### 创建任务

1. 执行 `nanospec new` 命令
2. 填写 brief.md，格式：

```markdown
# [任务名称]

[用户的原始描述，一句话或几个要点]

---

有什么补充的吗？（都是选填）
- 相关资料先放 `assets/` 就行；简单任务直接平铺，复杂任务再按需拆成 `research/`、`bugs/`、`api/` 等子目录
- 有限制条件可以写一下
```

3. 提示用户下一步使用 `/{{cmd_prefix}}.1-spec` 生成规格说明

### 信息不足场景

1. 不执行 `nanospec new`
2. 先向用户提一个简短问题：请提供任务名称和一句话目标
3. 得到补充后再继续创建任务

## Checklist

- 已提取并校验任务名
- 执行了 `nanospec new`
- brief.md 已填写用户意图

"""
